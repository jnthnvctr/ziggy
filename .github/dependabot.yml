version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Give new releases a week to be vetted (and pulled if malicious) before proposing them.
    cooldown:
      default-days: 7
    ignore:
      # TypeScript majors must wait until typescript-eslint supports them (see #58).
      # Upgrade deliberately: bump typescript + typescript-eslint together.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
